<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>英语默写练习</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --bg: #f3f4f7;
      --card: #ffffff;
      --fg: #16181d;
      --muted: #8a9099;
      --line: #e7e9ee;
      --accent: #2f6bff;
      --accent-soft: #e9f0ff;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px rgba(16, 24, 40, .06);
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --card: #171b22;
        --fg: #e9ebef;
        --muted: #868c96;
        --line: #232936;
        --accent: #6b93ff;
        --accent-soft: #1b2436;
        --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 32px rgba(0, 0, 0, .4);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }

    .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top);
    }
    .head-inner { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; max-width: 680px; margin: 0 auto; }
    h1 { font-size: 1.05rem; font-weight: 650; margin: 0; letter-spacing: .01em; }
    .count { color: var(--muted); font-size: .82rem; margin-left: auto; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 0 6px; }
    .field { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
    .field label { color: var(--muted); font-size: .8rem; }
    select {
      border: 0; background: transparent; color: var(--fg); font: inherit;
      font-size: .9rem; padding: 4px 2px; outline: none; max-width: 42vw;
    }

    .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    .seg button {
      border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .88rem;
      padding: 6px 14px; border-radius: 9px; cursor: pointer;
    }
    .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    .word-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

    .card {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 15px 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color .15s ease, transform .06s ease;
    }
    .card:active { transform: scale(.995); }
    .card.revealed { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

    .idx { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; text-align: right; }

    .content { min-width: 0; }
    .prompt { display: block; font-size: 1.22rem; font-weight: 550; word-break: break-word; }
    .answer {
      display: block;
      margin-top: 5px;
      font-size: 1rem;
      color: var(--accent);
      word-break: break-word;
      display: none;
    }
    .card.revealed .answer { display: block; }

    .chev { color: var(--muted); font-size: 1.35rem; line-height: 1; transition: transform .18s ease; }
    .card.revealed .chev { transform: rotate(90deg); }

    .pager { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 18px 0 4px; }
    .pager button {
      border: 1px solid var(--line); background: var(--card); color: var(--fg);
      font: inherit; font-size: .95rem; padding: 11px 20px; border-radius: 12px; cursor: pointer;
    }
    .pager button:disabled { opacity: .4; }
    .page-info { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; min-width: 62px; text-align: center; }

    .empty { color: var(--muted); text-align: center; padding: 40px 0; }

    .actionbar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--bg);
      border-top: 1px solid var(--line);
    }
    .actionbar button {
      display: block; width: 100%; max-width: 680px; margin: 0 auto;
      border: 0; border-radius: 14px; padding: 14px; font: inherit; font-size: 1rem; font-weight: 600;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    .actionbar button.off { background: var(--accent-soft); color: var(--accent); }

    @media (max-width: 400px) {
      .prompt { font-size: 1.12rem; }
      .card { padding: 14px; gap: 10px; grid-template-columns: 28px 1fr auto; }
    }
  </style>
</head>

<body>
  <header>
    <div class="head-inner">
      <h1>英语默写练习</h1>
      <span class="count" id="count"></span>
    </div>
  </header>

  <div class="wrap">
    <div class="controls">
      <div class="field">
        <label for="monthSelect">月份</label>
        <select id="monthSelect"></select>
      </div>
      <div class="seg" id="dir">
        <button data-dir="en" class="on">英 → 中</button>
        <button data-dir="zh">中 → 英</button>
      </div>
      <div class="field">
        <label for="pageSize">每页</label>
        <select id="pageSize">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
      </div>
    </div>

    <ol class="word-list" id="wordList"></ol>

    <div class="pager">
      <button id="prev">上一页</button>
      <span class="page-info" id="pageInfo"></span>
      <button id="next">下一页</button>
    </div>
  </div>

  <div class="actionbar">
    <button id="toggle" class="off">显示答案</button>
  </div>

  <script>
    const MONTHS = ["2025-08", "2025-09", "2026-10"];
    const $ = s => document.querySelector(s);

    let words = [];
    let page = 0;
    let size = 10;
    let dir = "en";
    let allRevealed = false;

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function initMonths() {
      const sel = $("#monthSelect");
      MONTHS.forEach(m => {
        const o = document.createElement("option");
        o.value = m;
        o.textContent = m;
        sel.appendChild(o);
      });
      sel.value = MONTHS[MONTHS.length - 1];
      sel.addEventListener("change", () => load(sel.value));
    }

    async function load(month) {
      const list = $("#wordList");
      try {
        const res = await fetch("words/" + month + ".yaml", { cache: "no-cache" });
        if (!res.ok) throw new Error(res.status);
        words = (jsyaml.load(await res.text()) || []).filter(w => w && w.en);
        page = 0;
        allRevealed = false;
        $("#toggle").textContent = "显示答案";
        $("#toggle").classList.add("off");
        $("#count").textContent = words.length ? words.length + " 词" : "";
        render();
      } catch (e) {
        words = [];
        $("#count").textContent = "";
        list.innerHTML = '<li class="empty">加载失败：' + esc(month) + '.yaml 不存在或格式有误</li>';
      }
    }

    function render() {
      const list = $("#wordList");
      list.innerHTML = "";
      const start = page * size;
      words.slice(start, start + size).forEach((w, i) => {
        const li = document.createElement("li");
        li.className = "card";
        const prompt = dir === "en" ? w.en : w.zh;
        const answer = dir === "en" ? w.zh : w.en;
        li.innerHTML =
          '<span class="idx">' + (start + i + 1) + "</span>" +
          '<span class="content"><span class="prompt">' + esc(prompt) + "</span>" +
          '<span class="answer">' + esc(answer) + "</span></span>" +
          '<span class="chev">›</span>';
        li.addEventListener("click", () => li.classList.toggle("revealed"));
        if (allRevealed) li.classList.add("revealed");
        list.appendChild(li);
      });
      const total = Math.max(1, Math.ceil(words.length / size));
      $("#pageInfo").textContent = (page + 1) + " / " + total;
      $("#prev").disabled = page <= 0;
      $("#next").disabled = page >= total - 1;
    }

    function setReveal(v) {
      allRevealed = v;
      document.querySelectorAll(".card").forEach(c => c.classList.toggle("revealed", v));
      const b = $("#toggle");
      b.textContent = v ? "隐藏答案" : "显示答案";
      b.classList.toggle("off", !v);
    }

    initMonths();
    $("#pageSize").addEventListener("change", e => { size = +e.target.value; page = 0; render(); });
    $("#prev").addEventListener("click", () => { if (page > 0) { page--; render(); } });
    $("#next").addEventListener("click", () => {
      const total = Math.max(1, Math.ceil(words.length / size));
      if (page < total - 1) { page++; render(); }
    });
    $("#toggle").addEventListener("click", () => setReveal(!allRevealed));
    $("#dir").addEventListener("click", e => {
      const b = e.target.closest("button[data-dir]");
      if (!b) return;
      dir = b.dataset.dir;
      document.querySelectorAll("#dir button").forEach(x => x.classList.toggle("on", x === b));
      render();
    });

    load(MONTHS[MONTHS.length - 1]);
  </script>
</body>

</html>
