<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4ef; --surface: #fdfdf9; --surface-2: #eceee6;
      --ink: #20281f; --muted: #6f7a6e; --faint: #9aa496;
      --line: #e0e3d8; --line-strong: #c9cfc0;
      --accent: #2c6b4f; --accent-ink: #f2f8f3; --wash: #e9f1e8;
      --shadow: 0 1px 2px rgba(30, 45, 35, .05), 0 8px 22px rgba(30, 45, 35, .06);
      --ease: cubic-bezier(.22, .68, 0, 1);
      font-synthesis: none;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121613; --surface: #1b211d; --surface-2: #171c18;
        --ink: #e7ece5; --muted: #9aa79b; --faint: #667167;
        --line: #2b332c; --line-strong: #3a453b;
        --accent: #8fcdaa; --accent-ink: #0f1410; --wash: #223029;
        --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 22px rgba(0, 0, 0, .28);
      }
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      min-width: 320px; min-height: 100dvh; margin: 0; overflow-x: clip;
      color: var(--ink); background: var(--bg);
      font: 400 16px/1.5 -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    button, select { font: inherit; color: inherit; touch-action: manipulation; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .shell { width: min(100% - 28px, 680px); margin-inline: auto; }
    .skip-link { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    .skip-link:focus { top: 12px; }
    .top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
    .appbar { height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--accent); color: var(--accent-ink); }
    .brand-mark svg { width: 17px; height: 17px; }
    .brand-name { font-size: .95rem; font-weight: 720; letter-spacing: .01em; white-space: nowrap; }
    .count { color: var(--accent); font-size: .8rem; font-weight: 680; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 10px; }
    select { appearance: none; min-height: 42px; min-width: 0; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); font-size: .82rem; font-weight: 620; color: var(--ink); cursor: pointer; transition: border-color .16s var(--ease), background .16s var(--ease); }
    select:hover { border-color: var(--faint); }
    #monthSelect { flex: 1.4; min-width: 92px; }
    #pageSize { flex: 1; min-width: 84px; }
    .segmented { flex: 1.7; min-width: 128px; display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; gap: 3px; padding: 3px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
    .segmented button { min-height: 36px; min-width: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: .8rem; font-weight: 640; cursor: pointer; transition: color .16s var(--ease), background .16s var(--ease), box-shadow .16s var(--ease); }
    .segmented button:hover:not([aria-pressed="true"]) { color: var(--ink); }
    .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 3px rgba(20, 40, 30, .18); }
    .track { height: 2px; background: var(--line); }
    .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s var(--ease); }
    main { padding-top: 18px; }
    .list-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px 10px; }
    .list-meta h2 { margin: 0; font-size: .92rem; font-weight: 700; letter-spacing: -.01em; }
    .range { color: var(--muted); font-size: .72rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .word-list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
    .word-card { position: relative; border-bottom: 1px solid var(--line); transition: background .16s var(--ease); }
    .word-card:last-child { border-bottom: 0; }
    .word-card:nth-child(-n+10) { animation: row-in .22s var(--ease) both; }
    @keyframes row-in { from { opacity: .25; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .word-card:hover { background: color-mix(in srgb, var(--wash) 45%, var(--surface)); }
    .word-card.is-open { background: var(--wash); }
    .word-button { width: 100%; min-height: 62px; display: grid; grid-template-columns: 34px minmax(0, 1fr) 74px; align-items: start; padding: 13px 12px 13px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; }
    .word-button:active { transform: scale(.997); }
    .number { padding-top: 4px; color: var(--faint); font-size: .68rem; font-weight: 650; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
    .word-copy { min-width: 0; display: block; }
    .prompt { display: block; color: var(--ink); font-size: 1.06rem; line-height: 1.35; font-weight: 660; letter-spacing: -.012em; overflow-wrap: anywhere; }
    .prompt.is-zh { font-size: .95rem; line-height: 1.55; font-weight: 560; letter-spacing: 0; }
    .phon { display: block; margin-top: 3px; color: var(--muted); font-size: .75rem; line-height: 1.4; font-weight: 500; overflow-wrap: anywhere; }
    .answer-wrap { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .18s var(--ease), opacity .16s var(--ease); }
    .answer-inner { min-height: 0; overflow: hidden; }
    .answer { display: block; margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--accent); color: var(--accent); font-size: .94rem; line-height: 1.55; font-weight: 600; overflow-wrap: anywhere; }
    .answer.is-zh { font-size: .88rem; font-weight: 540; line-height: 1.6; }
    .word-card.is-open .answer-wrap { grid-template-rows: 1fr; opacity: 1; }
    .toggle-mark { width: 20px; height: 20px; margin-top: 5px; justify-self: start; display: grid; place-items: center; color: var(--faint); transition: color .16s var(--ease), transform .18s var(--ease); }
    .toggle-mark svg { width: 15px; height: 15px; }
    .word-card.is-open .toggle-mark { color: var(--accent); transform: rotate(45deg); }
    .speak-button { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); cursor: pointer; transition: color .16s var(--ease), border-color .16s var(--ease), background .16s var(--ease), transform .16s var(--ease); }
    .speak-button svg { width: 17px; height: 17px; }
    .speak-button:hover { color: var(--accent); border-color: var(--line-strong); }
    .speak-button:active { transform: scale(.92); }
    .word-card.is-open .speak-button { background: var(--surface); }
    .status { display: grid; justify-items: center; padding: 46px 24px; color: var(--muted); text-align: center; font-size: .85rem; line-height: 1.6; }
    .status strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: .95rem; font-weight: 700; }
    .status-icon { display: grid; place-items: center; width: 42px; height: 42px; margin-bottom: 14px; border-radius: 12px; background: var(--wash); color: var(--accent); }
    .status-icon svg { width: 20px; height: 20px; }
    .retry { min-height: 40px; margin-top: 16px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--accent); font-size: .82rem; font-weight: 680; cursor: pointer; transition: background .16s var(--ease), transform .16s var(--ease); }
    .retry:hover { background: var(--wash); }
    .retry:active { transform: scale(.97); }
    .skeleton { height: 62px; padding: 16px 14px 16px 48px; }
    .skeleton::before, .skeleton::after { content: ""; display: block; height: 11px; border-radius: 99px; background: var(--surface-2); animation: pulse 1.15s var(--ease) infinite alternate; }
    .skeleton::before { width: 34%; }
    .skeleton::after { width: 20%; margin-top: 9px; }
    @keyframes pulse { to { opacity: .45; } }
    .pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 14px; padding-bottom: 8px; }
    .pager button { min-height: 44px; width: max-content; max-width: 100%; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: .8rem; font-weight: 640; cursor: pointer; transition: background .16s var(--ease), border-color .16s var(--ease), transform .16s var(--ease); }
    .pager button:last-child { justify-self: end; }
    .pager button svg { width: 15px; height: 15px; }
    .pager button:hover:not(:disabled) { background: var(--wash); border-color: var(--faint); }
    .pager button:active:not(:disabled) { transform: scale(.97); }
    .pager button:disabled { opacity: .38; cursor: not-allowed; }
    .page-indicator { color: var(--muted); font-size: .74rem; font-weight: 620; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .actionbar { position: fixed; inset: auto 0 0; z-index: 40; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
    .reveal-all { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: .9rem; font-weight: 700; letter-spacing: .01em; cursor: pointer; transition: opacity .16s var(--ease), transform .16s var(--ease), filter .16s var(--ease); }
    .reveal-all:hover { filter: brightness(1.06); }
    .reveal-all:active { transform: scale(.99); }
    .reveal-all:disabled { opacity: .4; cursor: not-allowed; }
    @media (max-width: 400px) {
      .shell { width: min(100% - 20px, 680px); }
      .appbar { height: 50px; }
      .word-button { grid-template-columns: 28px minmax(0, 1fr) 70px; padding: 12px 10px 12px 12px; }
      .prompt { font-size: 1rem; }
      .prompt.is-zh { font-size: .9rem; }
      .speak-button { width: 32px; height: 32px; top: 11px; right: 10px; }
    }
    @media (min-width: 700px) {
      .appbar { height: 58px; }
      .controls-row { padding-bottom: 12px; }
      select { min-height: 44px; }
      .word-button { min-height: 66px; }
      main { padding-top: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
</style>
</head>
<body>
  <a class="skip-link" href="#practice">跳到词汇列表</a>
  <div class="top">
    <header class="shell appbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5c3.5-1 6.3-.4 8.5 1.5 2.2-1.9 5-2.5 8.5-1.5v13c-3.5-1-6.3-.4-8.5 1.5-2.2-1.9-5-2.5-8.5-1.5z"/><path d="M12 7v13"/></svg></span><span class="brand-name">词汇默写</span></div>
      <span class="count" id="count" aria-live="polite"></span>
    </header>
    <div class="shell controls-row" aria-label="练习设置">
      <select id="monthSelect" aria-label="词表月份"></select>
      <div class="segmented" id="direction" role="group" aria-label="默写方向"><button type="button" data-dir="en" aria-pressed="true">英 → 中</button><button type="button" data-dir="zh" aria-pressed="false">中 → 英</button></div>
      <select id="pageSize" aria-label="每页条数"><option value="10" selected>10 条</option><option value="20">20 条</option><option value="30">30 条</option><option value="40">40 条</option><option value="50">50 条</option><option value="100">100 条</option></select>
    </div>
    <div class="track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <main class="shell" id="practice">
    <div class="list-meta"><h2 id="listTitle">本页词汇</h2><span class="range" id="rangeInfo"></span></div>
    <ol class="word-list" id="wordList" aria-labelledby="listTitle"></ol>
    <nav class="pager" aria-label="词表分页"><button type="button" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>上一页</button><span class="page-indicator" id="pageInfo" aria-live="polite"></span><button type="button" id="next">下一页<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></nav>
  </main>
  <div class="actionbar"><button class="reveal-all" id="toggle" type="button" aria-pressed="false"><span id="toggleLabel">显示本页全部答案</span></button></div>
<script>
    (() => {
      'use strict';
      const MONTHS = ['2025-08', '2025-09', '2026-10'];
      const $ = (selector) => document.querySelector(selector);
      const list = $('#wordList');
      const count = $('#count');
      const monthSelect = $('#monthSelect');
      const pageSize = $('#pageSize');
      const pageInfo = $('#pageInfo');
      const progressFill = $('#progressFill');
      const rangeInfo = $('#rangeInfo');
      const toggleButton = $('#toggle');
      let words = [];
      let page = 0;
      let size = 10;
      let direction = 'en';
      let allRevealed = false;
      let requestId = 0;
      let pendingPage = 0;
      const PREF_KEY = 'eng-words:prefs';
      function readPrefs() { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (error) { return {}; } }
      function writePrefs(patch) { try { localStorage.setItem(PREF_KEY, JSON.stringify(Object.assign(readPrefs(), patch))); } catch (error) { /* storage unavailable */ } }
      let usVoice = null;

      function pickVoice() {
        if (!window.speechSynthesis) return null;
        const voices = window.speechSynthesis.getVoices() || [];
        return voices.find((v) => /^en[-_]US/i.test(v.lang)) || voices.find((v) => /^en/i.test(v.lang)) || null;
      }
      function refreshVoice() { usVoice = pickVoice(); }
      if (window.speechSynthesis) {
        refreshVoice();
        if ('onvoiceschanged' in window.speechSynthesis) window.speechSynthesis.onvoiceschanged = refreshVoice;
      }
      function speak(text) {
        const synth = window.speechSynthesis;
        if (!synth || !text) return;
        try {
          synth.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.92;
          const voice = usVoice || pickVoice();
          if (voice) utterance.voice = voice;
          synth.speak(utterance);
        } catch (error) { /* speech unsupported */ }
      }
      const SPEAKER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>';

      const PLUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      const STATUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 8v8L12 20.5 3.5 16V8z"/><path d="M8 12h8"/></svg>';
      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      }
      function setAllRevealed(value) {
        allRevealed = value;
        list.querySelectorAll('.word-card').forEach((card) => {
          card.classList.toggle('is-open', value);
          card.querySelector('.word-button').setAttribute('aria-expanded', String(value));
          card.querySelector('.answer-wrap').setAttribute('aria-hidden', String(!value));
        });
        $('#toggleLabel').textContent = value ? '隐藏本页全部答案' : '显示本页全部答案';
        toggleButton.setAttribute('aria-pressed', String(value));
      }
      function render() {
        const pages = Math.max(1, Math.ceil(words.length / size));
        page = Math.min(page, pages - 1);
        const offset = page * size;
        list.innerHTML = '';
        words.slice(offset, offset + size).forEach((word, index) => {
          const prompt = direction === 'en' ? word.en : word.zh;
          const answer = direction === 'en' ? word.zh : word.en;
          const number = offset + index + 1;
          const item = document.createElement('li');
          item.className = 'word-card' + (allRevealed ? ' is-open' : '');
          const zhCls = (text) => (/[\u3400-\u9fff]/.test(text) ? ' is-zh' : '');
          const phon = word.ph ? '<span class="phon">' + escapeHTML(word.ph) + '</span>' : '';
          const copy = direction === 'en'
            ? '<span class="prompt">' + escapeHTML(prompt) + '</span>' + phon + '<span class="answer-wrap" aria-hidden="' + !allRevealed + '"><span class="answer-inner"><span class="answer' + zhCls(answer) + '">' + escapeHTML(answer) + '</span></span></span>'
            : '<span class="prompt' + zhCls(prompt) + '">' + escapeHTML(prompt) + '</span><span class="answer-wrap" aria-hidden="' + !allRevealed + '"><span class="answer-inner"><span class="answer">' + escapeHTML(answer) + phon + '</span></span></span>';
          item.innerHTML = '<button class="word-button" type="button" aria-expanded="' + allRevealed + '" aria-label="第' + number + '词，' + escapeHTML(prompt) + '，点击切换答案">' +
            '<span class="number">' + String(number).padStart(3, '0') + '</span>' +
            '<span class="word-copy">' + copy + '</span>' +
            '<span class="toggle-mark" aria-hidden="true">' + PLUS_ICON + '</span></button>' +
            '<button class="speak-button" type="button" aria-label="朗读 ' + escapeHTML(word.en) + '（美式读音）" title="美式读音">' + SPEAKER_ICON + '</button>';
          item.querySelector('.speak-button').addEventListener('click', (event) => {
            event.stopPropagation();
            speak(word.en);
          });
          item.querySelector('.word-button').addEventListener('click', () => {
            item.classList.toggle('is-open');
            item.querySelector('.word-button').setAttribute('aria-expanded', String(item.classList.contains('is-open')));
            item.querySelector('.answer-wrap').setAttribute('aria-hidden', String(!item.classList.contains('is-open')));
            allRevealed = [...list.querySelectorAll('.word-card')].every((card) => card.classList.contains('is-open'));
            $('#toggleLabel').textContent = allRevealed ? '隐藏本页全部答案' : '显示本页全部答案';
            toggleButton.setAttribute('aria-pressed', String(allRevealed));
          });
          list.appendChild(item);
        });
        if (!words.length) list.innerHTML = '<li class="status"><span class="status-icon">' + STATUS_ICON + '</span><strong>这个词表还是空的</strong>换一个月份，继续练习。</li>';
        pageInfo.textContent = '第 ' + (page + 1) + ' / ' + pages + ' 页';
        const shown = Math.min(offset + size, words.length);
        progressFill.style.width = words.length ? (shown / words.length * 100) + '%' : '0%';
        rangeInfo.textContent = words.length ? (offset + 1) + '-' + shown + ' / ' + words.length : '0 / 0';
        $('#prev').disabled = page <= 0;
        $('#next').disabled = page >= pages - 1;
        toggleButton.disabled = words.length === 0;
        count.textContent = words.length ? words.length + ' 词' : '';
      }
      async function load(month) {
        const thisRequest = ++requestId;
        list.innerHTML = '<li class="skeleton" role="status" aria-label="正在载入词表"></li><li class="skeleton" aria-hidden="true"></li><li class="skeleton" aria-hidden="true"></li>';
        count.textContent = '载入中';
        pageInfo.textContent = '载入中';
        progressFill.style.width = '0%';
        rangeInfo.textContent = '';
        $('#prev').disabled = true; $('#next').disabled = true;
        toggleButton.disabled = true;
        try {
          const response = await fetch('words/' + encodeURIComponent(month) + '.yaml', { cache: 'no-cache' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          if (!window.jsyaml) throw new Error('YAML 解析器不可用');
          const parsed = window.jsyaml.load(await response.text());
          if (!Array.isArray(parsed)) throw new Error('词表格式无效');
          if (thisRequest !== requestId) return;
          words = parsed.filter((word) => word && typeof word.en === 'string' && typeof word.zh === 'string');
          page = Math.min(pendingPage || 0, Math.max(1, Math.ceil(words.length / size)) - 1);
          pendingPage = 0;
          allRevealed = false;
          render();
          writePrefs({ month, page });
        } catch (error) {
          if (thisRequest !== requestId) return;
          words = [];
          allRevealed = false;
          count.textContent = '';
          pageInfo.textContent = '暂不可用';
          list.innerHTML = '<li class="status" role="alert"><span class="status-icon">' + STATUS_ICON + '</span><strong>词表暂时无法载入</strong>请检查网络连接，或换一个月份。<br><button class="retry" type="button">重新载入</button></li>';
          list.querySelector('.retry').addEventListener('click', () => load(monthSelect.value));
          progressFill.style.width = '0%';
          rangeInfo.textContent = '0 / 0';
          toggleButton.disabled = true;
        }
      }
      MONTHS.forEach((month) => {
        const option = document.createElement('option');
        option.value = month;
        option.textContent = month;
        monthSelect.appendChild(option);
      });
      const PAGE_SIZES = [10, 20, 30, 40, 50, 100];
      const saved = readPrefs();
      if (PAGE_SIZES.includes(Number(saved.size))) size = Number(saved.size);
      pageSize.value = String(size);
      if (saved.dir === 'zh') direction = 'zh';
      $('#direction').querySelectorAll('button').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.dir === direction)));
      pendingPage = Number.isInteger(saved.page) && saved.page > 0 ? saved.page : 0;
      const startMonth = MONTHS.includes(saved.month) ? saved.month : MONTHS[MONTHS.length - 1];
      monthSelect.value = startMonth;
      monthSelect.addEventListener('change', () => { pendingPage = 0; writePrefs({ month: monthSelect.value }); load(monthSelect.value); });
      pageSize.addEventListener('change', () => { size = Number(pageSize.value); page = 0; allRevealed = false; writePrefs({ size: pageSize.value, page }); render(); });
      $('#prev').addEventListener('click', () => { if (page > 0) { page--; allRevealed = false; render(); writePrefs({ page }); } });
      $('#next').addEventListener('click', () => { if (page < Math.ceil(words.length / size) - 1) { page++; allRevealed = false; render(); writePrefs({ page }); } });
      toggleButton.addEventListener('click', () => setAllRevealed(!allRevealed));
      $('#direction').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-dir]');
        if (!button) return;
        direction = button.dataset.dir;
        $('#direction').querySelectorAll('button').forEach((candidate) => candidate.setAttribute('aria-pressed', String(candidate === button)));
        allRevealed = false;
        writePrefs({ dir: direction });
        render();
      });
      load(startMonth);
    })();
  </script>
</body>
</html>
